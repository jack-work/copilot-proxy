[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-copilot-proxy"
version = "0.2.0"
description = "A local proxy that serves the Anthropic and OpenAI APIs from GitHub Copilot"
readme = "README.md"
requires-python = ">=3.10"
# NO REQUIRED DEPENDENCIES, deliberately. --auth memory and --auth file are
# pure stdlib, so the common path installs nothing and `uvx --from git+...`
# works on a network that cannot reach PyPI's package CDN.
#
# keyring was a hard dependency until 2026-09-21 and cost seven downloads
# (keyring, jaraco-classes, jaraco-context, jaraco-functools, more-itertools,
# pywin32-ctypes, setuptools). On a restricted Windows network that fetch fails
# and the whole tool is unrunnable, including the modes that never needed it.
# The code already degrades correctly: a missing keyring reports itself as a
# missing library and names the other two modes.
dependencies = []

[project.optional-dependencies]
# `uvx --from "github-copilot-proxy[keyring]"`, or install the extra, when
# you want the credential in the OS store rather than memory or a file.
keyring = ["keyring>=25,<26"]

[project.scripts]
copilot-proxy = "proxy:main"
# Second entry point matching the distribution name, so `uvx github-copilot-proxy`
# works without --from. uvx runs the script whose name matches the package it
# installed; without this it errors even though the tool is installed correctly.
github-copilot-proxy = "proxy:main"

# Flat single-module layout: proxy.py sits at the repo root, not under src/, so
# that `python3 proxy.py` keeps working for the systemd unit and the tests.
# uv_build cannot express this (it insists on proxy/__init__.py); hatchling can.
[tool.hatch.build.targets.wheel]
only-include = ["proxy.py"]

# Replaces MANIFEST.in, which was setuptools-only and the last reason this
# project needed setuptools at all.
[tool.hatch.build.targets.sdist]
include = ["proxy.py", "tests/", "README.md", ".env.example", "config.example.json"]
exclude = ["**/__pycache__"]
