[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-anthropic-proxy"
version = "0.1.0"
description = "A small local Anthropic Messages API proxy for GitHub Copilot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["keyring>=25,<26"]

[project.scripts]
copilot-proxy = "proxy:main"

[tool.setuptools]
py-modules = ["proxy"]
